<!doctype html>
<!-- The printed sheet — screenshotted as the paper texture for the OG render (scene.py). -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Libre+Franklin:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--ink: #111111;
				--accent: #b3261e;
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1580px;
				height: 1000px;
				background: #fbfaf7;
				color: var(--ink);
			}
			body {
				padding: 84px 104px 72px;
				display: flex;
				flex-direction: column;
			}
			.kicker {
				font:
					600 19px/1 'Libre Franklin',
					sans-serif;
				letter-spacing: 0.2em;
				text-transform: uppercase;
			}
			.masthead {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				padding-bottom: 20px;
				border-bottom: 4px solid var(--ink);
			}
			.masthead .red {
				color: var(--accent);
			}
			.masthead .meta {
				color: rgb(17 17 17 / 0.6);
				font-weight: 500;
			}
			h1 {
				margin-top: 64px;
				font:
					300 236px/0.9 'Newsreader',
					serif;
				font-optical-sizing: auto;
				letter-spacing: -0.04em;
			}
			.deck {
				margin-top: 40px;
				max-width: 900px;
				font:
					italic 300 46px/1.25 'Newsreader',
					serif;
				color: rgb(17 17 17 / 0.78);
			}
			figure {
				margin-top: auto;
				display: flex;
				align-items: center;
				gap: 18px;
			}
			figure span {
				font:
					500 17px/1 'Libre Franklin',
					sans-serif;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				padding: 12px 16px;
				border: 1.5px solid var(--ink);
			}
			figure i {
				width: 34px;
				height: 1.5px;
				background: var(--ink);
				position: relative;
			}
			figure i::after {
				content: '';
				position: absolute;
				right: -1px;
				top: -4px;
				border: 5px solid transparent;
				border-left: 8px solid var(--ink);
				border-right: 0;
			}
			figcaption {
				margin-top: 16px;
				font:
					italic 400 21px/1.3 'Newsreader',
					serif;
				color: rgb(17 17 17 / 0.62);
			}
			.colophon {
				margin-top: 36px;
				padding-top: 16px;
				border-top: 1.5px solid rgb(17 17 17 / 0.15);
				display: flex;
				justify-content: space-between;
				font:
					400 16px/1 'Libre Franklin',
					sans-serif;
				letter-spacing: 0.06em;
				color: rgb(17 17 17 / 0.6);
			}
		</style>
	</head>
	<body>
		<div class="masthead kicker">
			<span class="red">Import / Export</span>
			<span class="meta">vandeley.art · Claude Code plugin</span>
		</div>
		<h1>Art Vandeley</h1>
		<p class="deck">Importer of skills. Exporter of well-architected components.</p>
		<figure><span>Architect</span><i></i><span>Judge</span><i></i><span>Export</span></figure>
		<figcaption>Fig. 1 — Nothing ships without a stamp.</figcaption>
		<div class="colophon">
			<span>Set in Newsreader &amp; Libre Franklin</span>
			<span>Yes, that Art Vandeley.</span>
		</div>
	</body>
</html>
